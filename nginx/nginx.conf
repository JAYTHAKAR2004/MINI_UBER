events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS resolver so Nginx dynamically refreshes API replica IPs on container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream eta_api_servers {
        zone eta_api_servers 64k;
        # Round Robin Load Balancing across all 3 FastAPI replicas
        server api1:8000 resolve max_fails=2 fail_timeout=10s;
        server api2:8000 resolve max_fails=2 fail_timeout=10s;
        server api3:8000 resolve max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        listen [::]:80;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://eta_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
